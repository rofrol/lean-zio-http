name = "lsrv"
defaultTargets = ["lsrv", "lsrv-db", "lsrv-hand", "lsrv-fixture", "lsrv-fixture-hand", "lsrv-test", "lsrv-bench", "lsrv-compare", "lsrv-arch"]
testDriver = "lsrv-test"

# The server's modules, one library per responsibility. Arch.lean (lsrv-arch)
# checks every module's imports against the allowed directions; Lake alone
# lets any module of a package import any other.

# The contracts: Query (database queries and results as values), Wire
# (connection <-> protocol adapter) and Handler (adapter <-> application).
# Query imports nothing; Wire and Handler import only Query.
[[lean_lib]]
name = "ServerContracts"
roots = ["Server.Query", "Server.Wire", "Server.Handler"]

# The transport's Lean side: the connection model and the FFI to the zio.ev
# loop (zig/). Imports only Wire.
[[lean_lib]]
name = "ServerTransport"
roots = ["Server.Conn", "Server.Transport"]

# The HTTP/1.1 adapter (Std.Http.Protocol.H1, decision D1) and the response
# writer; the hand-written parser as comparator and rollback. Import Wire and
# Handler, never the transport.
[[lean_lib]]
name = "ServerHttp"
roots = ["Server.Response", "Server.H1Adapter", "Server.HandParser"]

# The applications: import only Server.Handler and Server.Query (and each other).
[[lean_lib]]
name = "App"
roots = ["App.Hello", "App.Fixture", "App.Db"]

# Tests and measurements.
[[lean_lib]]
name = "TestSupport"
roots = ["Corpus"]

# The server executables link libpq (zig/src/pg.zig, glue.c); bench.sh puts
# its directory (pg_config --libdir) in LIBRARY_PATH.
[[lean_exe]]
name = "lsrv"
root = "Main"
moreLinkArgs = ["../zig/zig-out/lib/libzsrv.a", "-lpq"]

[[lean_exe]]
name = "lsrv-db"
root = "MainDb"
moreLinkArgs = ["../zig/zig-out/lib/libzsrv.a", "-lpq"]

[[lean_exe]]
name = "lsrv-hand"
root = "MainHand"
moreLinkArgs = ["../zig/zig-out/lib/libzsrv.a", "-lpq"]

[[lean_exe]]
name = "lsrv-fixture"
root = "Fixture"
moreLinkArgs = ["../zig/zig-out/lib/libzsrv.a", "-lpq"]

[[lean_exe]]
name = "lsrv-fixture-hand"
root = "FixtureHand"
moreLinkArgs = ["../zig/zig-out/lib/libzsrv.a", "-lpq"]

[[lean_exe]]
name = "lsrv-test"
root = "Test"

[[lean_exe]]
name = "lsrv-bench"
root = "Bench"

[[lean_exe]]
name = "lsrv-compare"
root = "Compare"

[[lean_exe]]
name = "lsrv-arch"
root = "Arch"
supportInterpreter = true
